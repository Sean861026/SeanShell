name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SeanShell.sln -p:Platform=x64 -r win-x64 -p:PublishReadyToRun=true
      - name: Verify formatting
        run: dotnet format SeanShell.sln --no-restore --verify-no-changes --verbosity minimal
      - name: Validate recovery script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\restore-explorer.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'tools/restore-explorer.ps1 contains PowerShell syntax errors.'
          }
      - name: Build
        run: dotnet build SeanShell.sln -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test SeanShell.sln -c Release -p:Platform=x64 --no-build
